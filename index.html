    <script>
      // Gracefully silence benign Vite HMR WebSocket proxy closing errors in Cloud Run / preview iframes
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('WebSocket closed without opened'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason.message || '').includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
