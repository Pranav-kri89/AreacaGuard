<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="108" fill="#090d16"/>
  <rect x="8" y="8" width="496" height="496" rx="100" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sun Circle in upper half -->
  <path d="M144 240 A112 112 0 0 1 368 240 Z" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Sun Rays -->
  <line x1="256" y1="80" x2="256" y2="112" stroke="#fef08a" stroke-width="24" stroke-linecap="round"/>
  <line x1="160" y1="128" x2="184" y2="152" stroke="#fef08a" stroke-width="24" stroke-linecap="round"/>
  <line x1="352" y1="128" x2="328" y2="152" stroke="#fef08a" stroke-width="24" stroke-linecap="round"/>

  <!-- Protective Smart Canopy Arc -->
  <path d="M96 264 Q256 176 416 264" stroke="url(#canopyGrad)" stroke-width="32" stroke-linecap="round"/>

  <!-- Areca Palm Leaf Sprouts -->
  <path d="M256 432 C256 352 192 288 160 272 C208 336 256 368 256 432 Z" fill="url(#leafGrad)"/>
  <path d="M256 432 C256 336 320 288 352 272 C304 336 256 368 256 432 Z" fill="url(#leafGrad)"/>
  <line x1="256" y1="432" x2="256" y2="256" stroke="#4ade80" stroke-width="24" stroke-linecap="round"/>

  <!-- Solar Dryer Bed Base -->
  <line x1="112" y1="432" x2="400" y2="432" stroke="#94a3b8" stroke-width="24" stroke-linecap="round"/>
</svg>
